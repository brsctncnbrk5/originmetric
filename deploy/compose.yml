name: originmetric
services:
  db:
    image: postgres:18.6-alpine
    # App logger owns safe error facts; PostgreSQL must not print failing row/body values.
    command:
      [
        postgres,
        -c,
        log_min_messages=fatal,
        -c,
        log_min_error_statement=panic,
        -c,
        log_error_verbosity=terse,
        -c,
        log_parameter_max_length_on_error=0,
      ]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: originmetric
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run init-env.sh first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run init-env.sh first}
    volumes:
      - db_data:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-originmetric.sh:ro
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U originmetric -d originmetric"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: &logging
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
  app:
    image: originmetric:${APP_TAG:?Use deploy.sh}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Run init-env.sh first}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Run init-env.sh first}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      INGEST_PROXY_TOKEN: ${INGEST_PROXY_TOKEN:?Run init-env.sh first}
      INGEST_PROXY_MODE: cloudflare
      OM_DOGFOOD_SITE_KEY: ${OM_DOGFOOD_SITE_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, proxy]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
  caddy:
    image: caddy:2.11.2-alpine
    environment:
      INGEST_PROXY_TOKEN: ${INGEST_PROXY_TOKEN:?Run init-env.sh first}
    ports:
      # Safe preparation default. Public ingress is a separate, audited VPS step.
      - "127.0.0.1:${OM_HTTP_PORT:-8088}:80"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [proxy]
    depends_on: [app]
    restart: unless-stopped
    logging: *logging
networks:
  backend:
    internal: true
  proxy:
volumes:
  db_data:
  caddy_data:
  caddy_config:
