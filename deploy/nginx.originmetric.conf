# Installed as /etc/nginx/sites-available/originmetric.
# Cloudflare official IPv4/IPv6 lists verified 2026-10-02.
# The upstream is the synthetic review listener: public data routes stay blocked
# until G1 is proven and a proxy preserving the real, trusted CF IP is installed.
geo $originmetric_cloudflare_peer {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

server {
    listen 80;
    server_name originmetric.app www.originmetric.app;
    access_log off;
    error_log /dev/null;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/originmetric-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        if ($originmetric_cloudflare_peer = 0) { return 403; }
        return 308 https://originmetric.app$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.originmetric.app;
    ssl_certificate /etc/letsencrypt/live/originmetric.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/originmetric.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null;
    if ($originmetric_cloudflare_peer = 0) { return 403; }
    return 308 https://originmetric.app$request_uri;
}

server {
    listen 443 ssl;
    server_name originmetric.app;
    ssl_certificate /etc/letsencrypt/live/originmetric.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/originmetric.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null;
    if ($originmetric_cloudflare_peer = 0) { return 403; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 16k;

    # G1 pending: uniformly drop browser events; no public fact creation.
    location = /api/v1/e { return 202; }
    location / { return 404; }
    location = / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host originmetric.app;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location = /api/health {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host originmetric.app;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        add_header Cache-Control "no-store" always;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location ^~ /js/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host originmetric.app;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host originmetric.app;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location ^~ /api/v1/ { return 503; }
    location ^~ /internal { return 404; }
    location ^~ /api/internal { return 404; }
    location ^~ /fixtures { return 404; }
}
