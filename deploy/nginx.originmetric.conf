server {
    listen 443 ssl;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    server_name originmetric.app;
    ssl_certificate /etc/letsencrypt/live/originmetric.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/originmetric.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null;
    if ($originmetric_cloudflare_peer = 0) { return 403; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 16k;

    # G1 pending: uniformly drop browser events; no public fact creation.
    location = /api/v1/e {
        add_header Cache-Control "no-store" always;
        return 202;
    }
    add_header Cache-Control "no-store" always;
    location / { return 404; }
    location = / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host originmetric.app;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header CF-Connecting-IP $remote_addr;
        include /etc/nginx/originmetric-proxy-token.conf;
        proxy_hide_header Cache-Control;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location = /api/health {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host originmetric.app;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header CF-Connecting-IP $remote_addr;
        include /etc/nginx/originmetric-proxy-token.conf;
        proxy_hide_header Cache-Control;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location ^~ /js/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host originmetric.app;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header CF-Connecting-IP $remote_addr;
        include /etc/nginx/originmetric-proxy-token.conf;
        proxy_hide_header Cache-Control;
        # Mutable tracker URL: short browser TTL; edge TTL is explicit, never immutable.
        add_header Cache-Control "public, max-age=300, s-maxage=3600" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host originmetric.app;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header CF-Connecting-IP $remote_addr;
        include /etc/nginx/originmetric-proxy-token.conf;
        proxy_hide_header Cache-Control;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location ^~ /api/v1/ { return 503; }
    location ^~ /internal { return 404; }
    location ^~ /api/internal { return 404; }
    location ^~ /fixtures { return 404; }
}
