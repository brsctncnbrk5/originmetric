name: CI

on:
  pull_request:
  push:
    branches: [main, "claude/**", "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (lint, types, tests, migrations, tracker, build, e2e, secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          # Throwaway CI-only credentials for an ephemeral service container.
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: originmetric_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d originmetric_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgres://ci:ci-only-not-a-secret@127.0.0.1:5432/originmetric_ci
      LOG_LEVEL: silent

    steps:
      - name: Checkout (full history for secret scanning)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks, full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git --redact -v /repo

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Migrations apply via CLI
        run: npm run db:migrate

      - name: Migrations consistency
        run: npm run db:check

      - name: Schema has no ungenerated changes
        run: |
          npx drizzle-kit generate
          git status --porcelain drizzle
          test -z "$(git status --porcelain drizzle)"

      - name: Unit + DB tests (real PostgreSQL 18, clean-database migration test)
        run: npm run test

      - name: Tracker build + gzip size gate
        run: npm run tracker:build

      - name: Next.js production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright (smoke + server API)
        run: npx playwright test

      - name: P1b local demo command
        run: npm run demo

      - name: Production package scripts syntax
        run: |
          bash -n scripts/deploy.sh scripts/vps/*.sh deploy/init-db.sh
          bash scripts/vps/test-deploy-control.sh
          bash scripts/vps/test-backup-readback.sh
          node --test scripts/vps/test-public-observation.mjs

      - name: Production Docker package, consent dogfood and encrypted restore proof
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age rclone
          bash scripts/vps/ci-package-proof.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
